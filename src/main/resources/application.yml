# ============================================================
# ba-analysis — 币安数据分析服务配置 (只读MySQL, 不访问币安)
# ============================================================

server:
  port: 443
  ssl:
    enabled: true
    key-store: file:./keystore.p12          # 自签名证书 (keytool 生成, 不入库)
    key-store-type: PKCS12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-alias: ba-analysis

spring:
  mvc:
    log-resolved-exception: false
  datasource:
    # 连接信息从环境变量读取 (start.sh 会自动加载本地 .env)。
    # DB_PASSWORD 无默认值: 未设置则启动失败, 避免把密码写进版本库。
    url: ${DB_URL:jdbc:mysql://43.155.216.33:3306/ba?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

logging:
  level:
    org.springframework.web.servlet.resource.ResourceHttpRequestHandler: ERROR

binance:
  # 仅 history-buffer-days 被分析器使用 (推导所需K线天数); 分析服务不访问币安, base-url/proxy 已移除。
  concurrency:
    history-buffer-days: 30

  analysis:

    # 首阴日候选池: 连涨中的强势币 (days 与 first-yin-day 对齐)
    consecutive-rise:
      enabled: false
      days: 3
      min-daily-rise-percent: 0.5
      min-total-rise-percent: 0
      volume-surge-ratio: 1.0

    rise-then-drop:
      enabled: false
      days: 5
      volume-surge-ratio: 1.0

    high-rise:
      enabled: false
      days: 7
      threshold-percent: 50
      volume-surge-ratio: 1.0

    drop-then-rise:
      enabled: false
      days: 5
      volume-surge-ratio: 1.0

    slow-rise:
      enabled: false
      days: 7
      max-daily-change-percent: 3
      volume-surge-ratio: 1.0

    price-drop-oi-rise:
      enabled: false
      days: 5
      max-price-rise-percent: 10
      min-oi-rise-percent: 20
      volume-surge-ratio: 1.0

    low-price-consolidation:
      enabled: false
      days: 7
      max-price-change-percent: 10
      low-price-percentile: 30
      volume-surge-ratio: 1.0

    bullish-accumulation:
      enabled: false
      days: 14
      min-score: 60
      price-lookback-days: 30
      drawdown-min: 10.0
      require-higher-low: true
      volume-increase-min: 1.2
      range-contraction-max: 0.8

    # 见顶做空: 连涨N天后首根阴线(已收盘), 次日开盘做空
    first-yin-day:
      enabled: false
      days: 3
      min-total-rise-percent: 15
      min-yin-drop-percent: 2.0
      volume-surge-ratio: 1.0
      take-profit-pct: 10.0
      stop-buffer-pct: 1.0
      max-stop-loss-pct: 15.0
      min-score: 0

    oi-consecutive-rise:
      enabled: false
      days: 5
      max-price-rise-percent: 7
      volume-surge-ratio: 1.0

    n-min-max:
      enabled: false
      days: 7

    n-day-low:
      enabled: false
      days: 7

    altcoin-pump-alert:
      enabled: false
      days: 7
      min-score: 65
      max-price-decline-percent: 15.0
      oi-consecutive-days: 3
      volume-expansion-ratio: 1.5
      low-price-percentile: 35.0
      wick-body-ratio: 1.5
      silent-buyer-ratio: 1.3
      max-drawdown-percent: 25.0

    reversal-long:
      enabled: false
      decline-min-days: 4
      decline-min-pct: 5.0
      decline-max-pct: 12.0
      reversal-min-pct: 1.0
      reversal-max-pct: 4.0
      take-profit-pct: 6.0
      stop-loss-pct: 4.0
      volume-confirm-ratio: 1.0
      quality-min-score: 55

    long-short-ratio:
      enabled: false
      period: 1h
      lookback: 12
      min-score: 60
      top-position-weight: 40
      taker-weight: 35
      divergence-weight: 25
      taker-bullish-min: 1.0

  schedule:
    # JVM 固定 Asia/Shanghai 运行 (见 AnalysisApplication)。以下 cron 均为北京时间。
    daily-analysis: "0 5 8 * * ?"
    short-term-analysis: "0 */5 * * * ?"

  report:
    dir: ./reports
